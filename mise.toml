[tools]
rust = "1.94.1"
java = "21.0.2"
"github:tuist/once" = { version = "0.46.3", exe = "once" }

[tasks.format]
description = "Format shared Rust sources."
run = "rustfmt --edition 2024 shared/rust/src/lib.rs shared/rust/tests/identity_tests.rs"

[tasks."format:check"]
description = "Check shared Rust formatting."
run = "rustfmt --check --edition 2024 shared/rust/src/lib.rs shared/rust/tests/identity_tests.rs"

[tasks.build]
description = "Build the macOS application bundle through Once."
run = "once build TuistCodeDesktop"

[tasks."build:ios"]
description = "Build the iOS simulator application bundle through Once."
run = "once build TuistCodeiOS"

[tasks."build:android"]
description = "Build the Android application package through Once."
run = "once build TuistCodeAndroid"

[tasks.test]
description = "Run shared Rust tests through Once."
run = "once test TuistCodeSharedTests"

[tasks.validate]
description = "Validate the Once workspace definition."
run = "once query validate-workspace"

[tasks.run]
description = "Open the macOS Tuist Code application bundle through Once."
run = "once run TuistCodeDesktop"
