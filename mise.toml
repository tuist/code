# Code — Git replication built on a write-ahead log in object storage.
#
# The toolchain is pinned so laptops, CI and build images produce identical
# BEAM bytecode. Bump erlang and elixir together: an Elixir build is tied to
# the OTP major it was compiled against.
[tools]
erlang = "29.1.1"
elixir = "1.20.4"
# The write-ahead log is a persisted wire format, so its schema is compiled
# from .proto rather than hand-written. See priv/proto and `mise run proto`.
protoc = "36.2"
# End-to-end tests drive a real server with a real git client over the real
# smart-HTTP protocol, which is a shell problem, not an ExUnit one.
shellspec = "0.28.1"
# A Rustler NIF accelerates the WAL encode/decode hot path. The toolchain is
# pinned so cross-machine builds produce identical native artifacts; see
# native/code_native/ for the crate itself.
rust = "1.97"
# Releases are cut from conventional commits; see mise/tasks/release.
git-cliff = "2.14.2"
helm = "4.3.0"
# The project website is a static Zola site deployed to Cloudflare Workers.
zola = "0.23.6"
# Cloudflare deployment tooling for the static website.
node = "26.10.0"

[env]
# Never pin MIX_ENV here: `mix test` only switches to :test when MIX_ENV is
# unset, so exporting it would silently run the suite against the dev config.
ERL_AFLAGS = "-kernel shell_history enabled"

[tasks.setup]
description = "Install dependencies and compile"
run = ["mix deps.get", "mix compile"]

[tasks.proto]
description = "Regenerate the write-ahead log schema from priv/proto"
run = "./scripts/generate-proto.sh"

[tasks.bench]
description = "Run the WAL encode/decode microbenchmarks (baseline)"
# BENCH_TAG defaults to "before". Re-run after a change with BENCH_TAG=after
# to compare against the saved baseline.
run = ["mix run bench/wal_index.exs", "mix run bench/wal_entry.exs"]

[tasks.test]
description = "Run the unit test suite"
run = "mix test"

[tasks."e2e:up"]
description = "Start RustFS and two clustered Code nodes"
# The object store (RustFS) comes from a pinned container image rather than a
# mise tool; a pinned image is also what CI runs.
run = "./spec/support/stack.sh up"

[tasks."e2e:down"]
description = "Stop the end-to-end stack"
run = "./spec/support/stack.sh down"

[tasks."e2e:logs"]
description = "Tail the end-to-end nodes' logs"
run = "./spec/support/stack.sh logs"

[tasks.e2e]
description = "Run the end-to-end suite against a live server and real S3"
# The stack is left standing on failure so it can be inspected; `mise run
# e2e:down` cleans up.
run = ["./spec/support/stack.sh up", "shellspec", "./spec/support/stack.sh down"]

[tasks.lint]
description = "Check formatting and run Credo"
run = ["mix format --check-formatted", "mix credo --strict"]

[tasks.typecheck]
description = "Run static type analysis"
run = "mix dialyzer --format short"

[tasks.server]
description = "Run a single node against the local filesystem object store"
run = "iex -S mix"

[tasks.site]
description = "Build the Code website"
run = ["node scripts/generate-og-images.mjs", "zola build"]

[tasks."site:serve"]
description = "Serve the Code website locally"
run = ["node scripts/generate-og-images.mjs", "zola serve"]

[tasks."verify:tuist"]
description = "Rehearse hosting Tuist's full Git history on the local two-node stack"
run = ["./spec/support/stack.sh up", "bash scripts/verification/large-repository.sh"]

[tasks."verify:recovery"]
description = "Recover a historical repository on the local two-node stack"
run = ["./spec/support/stack.sh up", "bash scripts/verification/recovery.sh"]
