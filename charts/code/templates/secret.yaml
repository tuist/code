apiVersion: v1
kind: Secret
metadata:
  name: {{ include "code.fullname" . }}-secrets
  labels:
    {{- include "code.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Distributed Erlang's shared secret. Nodes with different cookies silently
  # fail to cluster, so this must be identical across every replica and stable
  # across upgrades.
  RELEASE_COOKIE: {{ include "code.releaseCookie" . | quote }}
  CODE_ADMIN_TOKEN: {{ include "code.adminToken" . | quote }}
  {{- if and (not .Values.objectStore.existingSecret) .Values.objectStore.accessKeyId }}
  CODE_S3_ACCESS_KEY_ID: {{ .Values.objectStore.accessKeyId | quote }}
  CODE_S3_SECRET_ACCESS_KEY: {{ .Values.objectStore.secretAccessKey | quote }}
  {{- end }}
  {{- if and (eq .Values.auth.backend "static") .Values.auth.static.tokens }}
  CODE_AUTH_TOKENS: {{ .Values.auth.static.tokens | quote }}
  {{- end }}
