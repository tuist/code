# The whole system, locally.
#
# RustFS stands in for S3, and two Code nodes cluster with each other. Two
# rather than one on purpose: almost everything interesting here happens
# *between* replicas, and a single node cannot show you a push to one node
# being immediately visible on another, which is the central claim.
#
#   docker compose up --build -d
#   docker compose ps                      # wait for healthy
#
#   # create a repository (any node will do; there is no primary to find)
#   curl -X POST localhost:14002/repositories \
#     -H 'Authorization: Bearer local-admin-token' \
#     -H 'content-type: application/json' \
#     -d '{"repository":"acme/app"}'
#
#   # push to node 1
#   git clone http://x-access-token:local-token@localhost:14000/acme/app.git
#
# On macOS, add `-c credential.helper=` to those git commands. The keychain
# helper blocks trying to store a credential for a host:port it has not seen
# before, and the symptom is a git command that hangs with no output at all.
#
#   # and fetch it from node 2, which has never seen it before
#   git clone http://x-access-token:local-token@localhost:14010/acme/app.git
#
#   # watch the cluster and the log
#   curl -H 'Authorization: Bearer local-admin-token' localhost:14002/cluster
#   curl -H 'Authorization: Bearer local-admin-token' localhost:14002/repositories/acme/app
#
# Ports are deliberately unusual: 9000 is the S3 API port RustFS inherits from
# MinIO's convention and is one of the most contended ports on a developer
# machine, and 4000 is Phoenix's.
name: code

services:
  storage:
    # RustFS speaks the S3 API on 9000, the same interface Code targets in
    # production against actual S3. Pinned rather than a floating tag because
    # the end-to-end suite asserts on conditional-write behaviour and that is
    # exactly the kind of thing that shifts between releases. MinIO used to
    # sit here; its OSS `minio/minio` and `minio/mc` images stopped being
    # served by public registries.
    image: rustfs/rustfs:v1.0.0-rc.5
    environment:
      RUSTFS_ACCESS_KEY: code
      RUSTFS_SECRET_KEY: code-secret
    ports:
      # Deliberately not the port spec/support/stack.sh uses: the end-to-end
      # stack runs its own storage node, and two stacks sharing a port means
      # one silently talks to the other's storage.
      - "19020:9000"
      - "19021:9001"
    healthcheck:
      # Busybox `nc` in the RustFS image; a TCP-level check because RustFS
      # replies 403 to an unauthenticated GET on `/`, which would fail
      # `curl -f`.
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - storage:/data

  createbucket:
    # The vanilla AWS CLI works against RustFS and against real S3 and is
    # anonymously pullable, unlike MinIO's `mc`.
    image: amazon/aws-cli:2.37.3
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: code
      AWS_SECRET_ACCESS_KEY: code-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://storage:9000 s3api list-buckets >/dev/null 2>&1; do sleep 1; done &&
      aws --endpoint-url http://storage:9000 s3api create-bucket --bucket code 2>/dev/null || true &&
      aws --endpoint-url http://storage:9000 s3api head-bucket --bucket code &&
      echo 'bucket ready'
      "

  code-1: &code
    build: .
    depends_on:
      createbucket:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          # Both nodes answer to this name, so one DNS lookup returns both
          # addresses and the cluster forms itself. This is the same mechanism
          # a Kubernetes headless Service provides.
          - code-node
    environment: &code-env
      CODE_S3_BUCKET: code
      CODE_S3_ENDPOINT: http://storage:9000
      CODE_S3_ACCESS_KEY_ID: code
      CODE_S3_SECRET_ACCESS_KEY: code-secret
      CODE_S3_REGION: us-east-1
      CODE_S3_PATH_STYLE: "true"
      CODE_ADMIN_TOKEN: local-admin-token
      CODE_AUTH_BACKEND: static
      CODE_AUTH_TOKENS: "local-token=acme:read,write"
      CODE_CLUSTER_STRATEGY: dns
      CODE_DNS_QUERY: code-node
      CODE_RELEASE_NAME: code
      # Distributed Erlang's shared secret. Nodes with different cookies fail
      # to cluster, silently.
      RELEASE_COOKIE: local-development-cookie
      CODE_DEFAULT_REPLICAS: "2"
    healthcheck:
      # Readiness, not liveness: it checks that object storage is reachable,
      # because a node that cannot read the log cannot answer consistently.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4002/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    ports:
      - "14000:4000"
      - "14002:4002"

  code-2:
    <<: *code
    environment:
      <<: *code-env
    ports:
      - "14010:4000"
      - "14012:4002"

volumes:
  storage:
