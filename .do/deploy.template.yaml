spec:
  name: code
  services:
    - name: code
      git:
        branch: main
        repo_clone_url: https://github.com/tuist/code.git
      dockerfile_path: ./Dockerfile
      http_port: 4000
      health_check:
        http_path: /health
      envs:
        # App Platform asks for variables without values during creation.
        # Credentials remain in the user's account, not this repository.
        - key: CODE_S3_BUCKET
          scope: RUN_TIME
          type: SECRET
        - key: CODE_S3_ENDPOINT
          scope: RUN_TIME
          type: SECRET
        - key: CODE_S3_ACCESS_KEY_ID
          scope: RUN_TIME
          type: SECRET
        - key: CODE_S3_SECRET_ACCESS_KEY
          scope: RUN_TIME
          type: SECRET
        - key: CODE_AUTH_BACKEND
          value: static
          scope: RUN_TIME
          type: GENERAL
        - key: CODE_AUTH_TOKENS
          scope: RUN_TIME
          type: SECRET
        - key: CODE_ADMIN_TOKEN
          scope: RUN_TIME
          type: SECRET
