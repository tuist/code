[[target]]
name = "TuistCodeShared"
kind = "rust_library"
srcs = ["shared/rust/src/**/*.rs"]

[target.attrs]
crate_name = "tuist_code_shared"
crate_root = "shared/rust/src/lib.rs"
edition = "2024"
target = "aarch64-apple-darwin"
crate_type = "staticlib"

[[target]]
name = "TuistCodeSharedTestSupport"
kind = "rust_library"
srcs = ["shared/rust/src/**/*.rs"]

[target.attrs]
crate_name = "tuist_code_shared"
crate_root = "shared/rust/src/lib.rs"
edition = "2024"
target = "aarch64-apple-darwin"

[[target]]
name = "TuistCodeSharedTests"
kind = "rust_test"
srcs = ["shared/rust/tests/**/*.rs"]
deps = ["./TuistCodeSharedTestSupport"]

[target.attrs]
crate_name = "tuist_code_shared_tests"
crate_root = "shared/rust/tests/identity_tests.rs"
edition = "2024"
target = "aarch64-apple-darwin"
labels = ["unit"]

[[target]]
name = "TuistCodeAgent"
kind = "rust_binary"
srcs = ["shared/rust/src/**/*.rs"]
deps = ["./TuistCodeSharedTestSupport"]

[target.attrs]
crate_name = "tuist_code_agent"
crate_root = "shared/rust/src/bin/tuist_code_agent.rs"
edition = "2024"
env_inherit = ["TUIST_CODE_AGENT_API_KEY"]

[[target]]
name = "TuistCodeMobileShared"
kind = "rust_mobile_library"
srcs = ["shared/rust/src/**/*.rs"]

[target.attrs]
crate_name = "tuist_code_shared"
crate_root = "shared/rust/src/lib.rs"
edition = "2024"
apple_target = "aarch64-apple-ios-sim"
android_target = "aarch64-linux-android"
android_abi = "arm64-v8a"
android_api = 35

[[target]]
name = "TuistCodeDesktop"
kind = "apple_application"
srcs = ["apps/apple/Sources/**/*.swift", "apps/desktop/Sources/**/*.swift"]
deps = ["./TuistCodeShared"]

[target.attrs]
platform = "macos"
bundle_id = "dev.tuist.code"
minimum_os = "15.0"
families = ["mac"]
product_name = "Tuist Code"
resources = [".once/out/TuistCodeAgent/tuist_code_agent"]
prebuild_actions = ["{\"name\":\"Build Rust Agent\",\"script\":\"once build TuistCodeAgent\",\"cacheable\":false}"]
asset_catalogs = ["apps/desktop/Assets.xcassets"]
app_icon = "AppIcon"
info_plist = "apps/desktop/Info.plist"
swift_flags = ["-F", ".build/sparkle/Sparkle.xcframework/macos-arm64_x86_64"]
linkopts = [
  "-F.build/sparkle/Sparkle.xcframework/macos-arm64_x86_64",
  "-framework",
  "Sparkle",
  "-Xlinker",
  "-rpath",
  "-Xlinker",
  "@executable_path/../Frameworks",
]

[[target]]
name = "TuistCodeiOS"
kind = "apple_application"
srcs = ["apps/apple/Sources/**/*.swift", "apps/ios/Sources/**/*.swift"]
deps = ["./TuistCodeMobileShared"]

[target.attrs]
platform = "ios"
bundle_id = "dev.tuist.code.ios"
minimum_os = "17.0"
sdk_variant = "simulator"
families = ["iphone"]
product_name = "Tuist Code"
asset_catalogs = ["apps/ios/Assets.xcassets"]
app_icon = "AppIcon"
info_plist = "apps/ios/Info.plist"

[[target]]
name = "TuistCodeiOSRelease"
kind = "apple_application"
srcs = ["apps/apple/Sources/**/*.swift", "apps/ios/Sources/**/*.swift"]
deps = ["./TuistCodeiOSSharedRelease"]

[target.attrs]
platform = "ios"
bundle_id = "dev.tuist.code.ios"
minimum_os = "17.0"
sdk_variant = "device"
families = ["iphone"]
product_name = "Tuist Code"
asset_catalogs = ["apps/ios/Assets.xcassets"]
app_icon = "AppIcon"
info_plist = "apps/ios/Info.plist"

[[target]]
name = "TuistCodeiOSSharedRelease"
kind = "rust_library"
srcs = ["shared/rust/src/**/*.rs"]

[target.attrs]
crate_name = "tuist_code_shared"
crate_root = "shared/rust/src/lib.rs"
edition = "2024"
target = "aarch64-apple-ios"
crate_type = "staticlib"

[[target]]
name = "TuistCodeAndroid"
kind = "android_binary"
srcs = ["apps/android/src/**/*.java"]
deps = ["./TuistCodeMobileShared"]

[target.attrs]
application_id = "dev.tuist.code"
namespace = "dev.tuist.code"
manifest = "apps/android/AndroidManifest.xml"
resource_files = ["apps/android/res/**"]
resource_dirs = ["apps/android/res"]
compile_sdk = 35
min_sdk_version = 26
target_sdk_version = 35
build_tools_version = "35.0.0"
version_code = 1
version_name = "0.1.0"
launch_activity = ".MainActivity"

[[target]]
name = "TuistCodeAndroidRelease"
kind = "android_binary"
srcs = ["apps/android/src/**/*.java"]
deps = ["./TuistCodeMobileShared"]

[target.attrs]
application_id = "dev.tuist.code"
namespace = "dev.tuist.code"
manifest = "apps/android/AndroidManifest.xml"
resource_files = ["apps/android/res/**"]
resource_dirs = ["apps/android/res"]
compile_sdk = 35
min_sdk_version = 26
target_sdk_version = 35
build_tools_version = "35.0.0"
version_code = 1
version_name = "0.1.0"
launch_activity = ".MainActivity"
signing = "none"
