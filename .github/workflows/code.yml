name: Tuist Code

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tuist-code-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Build and test macOS application
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Build through Once
        run: mise run build
      - name: Test through Once
        run: mise run test

  validate:
    name: Validate Once workspace
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Validate the Once workspace
        run: mise run validate
